<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merci — Renaître de la soif</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--amber:#E8832A;--dark:#C96A10;}
body{
  font-family:'Montserrat',sans-serif;
  background:#1a1206;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
}
.hero-bg{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse 150% 150% at 100% 0%,#fff8d0 0%,#e8832a 30%,#2a1f0a 70%,#1a1206 100%);
  opacity:0.15;
  pointer-events:none;
}
.wrap{
  max-width:540px;
  margin:0 auto;
  padding:60px 30px;
  text-align:center;
  position:relative;
}
.merci-titre{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2.5rem,8vw,4rem);
  font-weight:300;
  color:#fff;
  text-shadow:0 2px 20px rgba(0,0,0,0.5);
  margin-bottom:16px;
  opacity:0;
  animation:fadeUp 0.8s ease 0.3s forwards;
}
.merci-texte{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1rem,3vw,1.3rem);
  font-weight:300;
  color:rgba(255,255,255,0.75);
  font-style:italic;
  line-height:1.8;
  margin-bottom:40px;
  opacity:0;
  animation:fadeUp 0.8s ease 0.6s forwards;
}
.btn-download{
  display:inline-block;
  padding:18px 40px;
  background:var(--amber);
  color:#fff;
  text-decoration:none;
  font-family:'Montserrat',sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  border-radius:2px;
  transition:all .3s;
  opacity:0;
  animation:fadeUp 0.8s ease 0.9s forwards;
}
.btn-download:hover{background:var(--dark);transform:translateY(-2px);box-shadow:0 8px 30px rgba(232,131,42,0.4);}
.devise{
  margin-top:40px;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  color:var(--amber);
  font-size:1.1rem;
  opacity:0;
  animation:fadeUp 0.8s ease 1.2s forwards;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>
<div class="hero-bg"></div>
<div class="wrap">
  <h1 class="merci-titre">Merci.</h1>
  <p class="merci-texte">
    Vous avez fait le premier pas.<br>
    C'est déjà beaucoup.<br><br>
    Votre booklet vous attend.
  </p>
  <a class="btn-download" href="https://drive.google.com/uc?export=download&id=1Ae7u2s-vJjPaTennEim6W3jpxLItEkL5">
    Télécharger le booklet →
  </a>
  <p class="devise">Arkeï — Prokoptô</p>
</div>
</body>
</html>
