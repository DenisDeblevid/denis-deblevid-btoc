<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renaître de la soif — Télécharge le guide</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--brun:#2C1A08;--amber:#E8832A;--dark:#C96A10;}
body{
  font-family:'Montserrat',sans-serif;
  background:#1a1206;
  min-height:100vh;
  overflow-x:hidden;
}
.hero-bg{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse 150% 150% at 100% 0%,#fff8d0 0%,#e8832a 30%,#2a1f0a 70%,#1a1206 100%);
  opacity:0.15;
  pointer-events:none;
}
.wrap{max-width:900px;margin:0 auto;padding:30px 20px 60px;position:relative;}

/* TITRE */
.site-title{
  text-align:center;
  padding:20px 0 16px;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(0.9rem,2vw,1.1rem);
  font-weight:300;
  color:rgba(255,255,255,0.4);
  letter-spacing:4px;
  text-transform:uppercase;
}

/* BOOK PAGES */
.book-section{
  display:flex;
  gap:12px;
  justify-content:center;
  align-items:flex-start;
  padding:10px 0 30px;
  flex-wrap:wrap;
}
.page-wrapper{
  position:relative;
  flex:1;
  min-width:180px;
  max-width:240px;
}
.page-img{
  width:100%;
  border-radius:2px;
  box-shadow:4px 8px 30px rgba(0,0,0,0.7),-2px 0 8px rgba(0,0,0,0.3);
  display:block;
}
.page-1 .page-img{transform:perspective(800px) rotateY(3deg);}
.page-2 .page-img{transform:perspective(800px) rotateY(-1deg);}
.page-3{position:relative;overflow:hidden;}
.page-3 .page-img{transform:perspective(800px) rotateY(-3deg);}

/* DÉCHIRURE FRANCHE */
.torn-overlay{
  position:absolute;
  bottom:0;left:0;right:0;
  height:45%;
  background:linear-gradient(to bottom,transparent 0%,rgba(26,18,6,0.98) 45%,#1a1206 100%);
  pointer-events:none;
}
.torn-line{
  position:absolute;
  bottom:44%;
  left:-5px;right:-5px;
  height:20px;
  background:#1a1206;
  clip-path:polygon(0% 60%,3% 20%,6% 80%,9% 30%,12% 70%,15% 15%,18% 65%,21% 25%,24% 75%,27% 20%,30% 70%,33% 30%,36% 80%,39% 25%,42% 65%,45% 15%,48% 70%,51% 30%,54% 75%,57% 20%,60% 65%,63% 25%,66% 70%,69% 15%,72% 60%,75% 20%,78% 75%,81% 30%,84% 70%,87% 20%,90% 65%,93% 25%,96% 70%,100% 40%,100% 100%,0% 100%);
}
.page-3-cta{
  position:absolute;
  bottom:10px;left:0;right:0;
  text-align:center;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--amber);
  font-weight:700;
}

/* FORMULAIRE */
.form-section{
  max-width:500px;
  margin:0 auto;
  padding:0 20px 30px;
}
.form-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.2rem,3vw,1.6rem);
  font-weight:300;
  color:#fff;
  text-align:center;
  margin-bottom:20px;
  font-style:italic;
}
.sib-form{background:transparent !important;}
#sib-container{
  background:rgba(255,255,255,0.06) !important;
  border-color:rgba(232,131,42,0.3) !important;
  border-radius:4px !important;
}
.form-input{
  width:100%;
  padding:14px 20px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(232,131,42,0.3);
  border-radius:2px;
  font-family:'Montserrat',sans-serif;
  font-size:14px;
  color:#fff;
  outline:none;
  transition:border .2s;
  margin-bottom:12px;
  display:block;
}
.form-input::placeholder{color:rgba(255,255,255,0.35);}
.form-input:focus{border-color:var(--amber);}
.btn-cta{
  width:100%;
  padding:18px;
  background:var(--amber);
  border:none;
  border-radius:2px;
  font-family:'Montserrat',sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#fff;
  cursor:pointer;
  transition:all .3s;
}
.btn-cta:hover{background:var(--dark);}
.legal{
  text-align:center;
  font-size:10px;
  color:rgba(255,255,255,0.25);
  margin-top:12px;
  line-height:1.6;
}

/* TEXTE CHOC */
.shock-section{
  max-width:600px;
  margin:0 auto;
  padding:30px 20px 20px;
  text-align:center;
}
.shock-word{
  display:inline-block;
  opacity:0;
  transform:translateY(10px) scale(0.95);
  transition:opacity 0.2s ease, transform 0.2s ease;
  margin:0 4px;
}
.shock-word.visible{
  opacity:1;
  transform:translateY(0) scale(1);
}
.sw-normal{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.1rem,3vw,1.5rem);
  font-weight:300;
  color:rgba(255,255,255,0.85);
  font-style:italic;
}
.sw-break{display:block;height:12px;}
.sw-big{
  font-family:'Montserrat',sans-serif;
  font-size:clamp(1.8rem,5vw,3rem);
  font-weight:700;
  color:#fff;
  letter-spacing:6px;
  text-transform:uppercase;
  text-shadow:0 0 40px rgba(232,131,42,0.6);
}
.sw-amber{
  font-family:'Montserrat',sans-serif;
  font-size:clamp(1.2rem,3vw,1.8rem);
  font-weight:700;
  color:var(--amber);
  letter-spacing:4px;
  text-transform:uppercase;
}
</style>
</head>
<body>
<div class="hero-bg"></div>

<div class="wrap">
  <div class="site-title">renaitredelasoif.fr</div>

  <!-- 1. BOOK PAGES -->
  <div class="book-section">
    <div class="page-wrapper page-1">
      <img class="page-img" src="https://raw.githubusercontent.com/denisdeblevid/denis-deblevid-btoc/main/BookletCouverture.png" alt="Couverture">
    </div>
    <div class="page-wrapper page-2">
      <img class="page-img" src="https://raw.githubusercontent.com/denisdeblevid/denis-deblevid-btoc/main/BookletPage1.png" alt="Page 2">
    </div>
    <div class="page-wrapper page-3">
      <img class="page-img" src="https://raw.githubusercontent.com/denisdeblevid/denis-deblevid-btoc/main/BookletPage2.png" alt="Introduction">
      <div class="torn-line"></div>
      <div class="torn-overlay"></div>
      <div class="page-3-cta">↓ N'attends pas</div>
    </div>
  </div>

  <!-- 2. FORMULAIRE -->
  <div class="form-section">
    <div class="form-title">Reçois ton booklet gratuitement</div>
    <form id="sib-form" method="POST" action="https://665240ff.sibforms.com/serve/MUIFACZkXYBN5zJEwBmve34opIxzw7yExXX1wdrZpJ4PYWOGBvd-YGh2m0MCUsFtR_mhjFK3ZI9Eix44dHxedrKCOvNlXDf3TBbnVSHX7dqvRqc5dfwditRVFmCPNlbA_wacBCzDw1jEUjYLIMdjNUHjqfSjl4MIoNJ-iq80D_UJUDaXM3BxXd07hHuWbCjPhnYshJF2xRmuLP4qwA==" data-type="subscription">
      <input class="form-input" type="text" id="EMAIL" name="EMAIL" placeholder="Ton adresse email" required>
      <input type="submit" class="btn-cta" value="N'attends pas — Télécharge-le →">
      <input type="text" name="email_address_check" value="" style="display:none;">
      <input type="hidden" name="locale" value="fr">
    </form>
    <p class="legal">Gratuit. Sans engagement. Désabonnement à tout moment.</p>
  </div>

  <!-- 3. TEXTE CHOC -->
  <div class="shock-section" id="shockSection">
    <span class="shock-word sw-normal">Tu portes</span>
    <span class="shock-word sw-normal">quelque chose.</span>
    <span class="shock-word sw-break"></span>
    <span class="shock-word sw-normal">Depuis trop longtemps.</span>
    <span class="shock-word sw-break"></span>
    <span class="shock-word sw-normal">Sans pouvoir le nommer.</span>
    <span class="shock-word sw-break"></span>
    <span class="shock-word sw-break"></span>
    <span class="shock-word sw-amber">Ce guide</span>
    <span class="shock-word sw-normal">ne te donnera pas les réponses.</span>
    <span class="shock-word sw-break"></span>
    <span class="shock-word sw-normal">Il te posera</span>
    <span class="shock-word sw-amber">les bonnes questions.</span>
    <span class="shock-word sw-break"></span>
    <span class="shock-word sw-break"></span>
    <span class="shock-word sw-big">MAINTENANT.</span>
  </div>
</div>


<script>
// Shock text animation on scroll
const words = document.querySelectorAll('.shock-word');
let triggered = false;

function animateWords(){
  if(triggered) return;
  const section = document.getElementById('shockSection');
  const rect = section.getBoundingClientRect();
  if(rect.top < window.innerHeight * 0.85){
    triggered = true;
    words.forEach((w, i) => {
      setTimeout(() => w.classList.add('visible'), i * 80);
    });
  }
}

window.addEventListener('scroll', animateWords);
animateWords();
</script>
</body>
</html>
